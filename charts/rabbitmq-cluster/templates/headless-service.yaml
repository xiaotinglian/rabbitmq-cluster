apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq-cluster.headlessServiceName" . }}
  labels:
    {{- include "rabbitmq-cluster.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "rabbitmq-cluster.selectorLabels" . | nindent 4 }}
  ports:
    - name: amqps
      port: {{ .Values.service.amqps.port }}
      targetPort: amqps
    - name: mgmt-https
      port: {{ .Values.service.management.port }}
      targetPort: mgmt-https
    - name: epmd
      port: 4369
      targetPort: epmd
    - name: dist
      port: 25672
      targetPort: dist
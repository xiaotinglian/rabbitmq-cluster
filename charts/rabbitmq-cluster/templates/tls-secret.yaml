{{- $secretName := include "rabbitmq-cluster.tlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $tls := dict -}}
{{- if $existing -}}
{{- $_ := set $tls "caCrt" (index $existing.data "ca.crt") -}}
{{- $_ := set $tls "tlsCrt" (index $existing.data "tls.crt") -}}
{{- $_ := set $tls "tlsKey" (index $existing.data "tls.key") -}}
{{- else -}}
{{- $altNames := list
  "localhost"
  (include "rabbitmq-cluster.fullname" .)
  (printf "%s.%s" (include "rabbitmq-cluster.fullname" .) .Release.Namespace)
  (printf "%s.%s.svc" (include "rabbitmq-cluster.fullname" .) .Release.Namespace)
  (printf "%s.%s.svc.%s" (include "rabbitmq-cluster.fullname" .) .Release.Namespace .Values.clusterDomain)
  (include "rabbitmq-cluster.headlessServiceName" .)
  (printf "%s.%s" (include "rabbitmq-cluster.headlessServiceName" .) .Release.Namespace)
  (printf "%s.%s.svc" (include "rabbitmq-cluster.headlessServiceName" .) .Release.Namespace)
  (printf "%s.%s.svc.%s" (include "rabbitmq-cluster.headlessServiceName" .) .Release.Namespace .Values.clusterDomain)
-}}
{{- $ca := genCA (printf "%s-ca" (include "rabbitmq-cluster.fullname" .)) (int .Values.rabbitmq.tls.validityDays) -}}
{{- $cert := genSignedCert "localhost" (list "127.0.0.1") $altNames (int .Values.rabbitmq.tls.validityDays) $ca -}}
{{- $_ := set $tls "caCrt" ($ca.Cert | b64enc) -}}
{{- $_ := set $tls "tlsCrt" ($cert.Cert | b64enc) -}}
{{- $_ := set $tls "tlsKey" ($cert.Key | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "rabbitmq-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ index $tls "caCrt" }}
  tls.crt: {{ index $tls "tlsCrt" }}
  tls.key: {{ index $tls "tlsKey" }}